name: Unit Tests (KAN logic)

on:
  push:
    branches: [main, master]
    paths:
      - 'download-service/**'
  pull_request:
    paths:
      - 'download-service/**'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('download-service/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r download-service/requirements.txt
          pip install requests

      - name: Install Playwright (import only, no browser download)
        run: pip install playwright

      - name: Run KAN unit tests (no network)
        env:
          API_KEY: ""
        working-directory: download-service
        run: python test_kan_local.py

      - name: Import check (Flask app loads)
        env:
          API_KEY: ""
        working-directory: download-service
        run: python -c "import app; print('App loads OK, routes:', sorted(str(r) for r in app.app.url_map.iter_rules()))"
