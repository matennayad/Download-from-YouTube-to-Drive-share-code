# קובץ תצורה של 3proxy - פרוקסי ישראלי להורדות כאן
# הנחה: הקובץ נמצא ליד 3proxy.exe בתיקייה C:\3proxy
#
# !!! החלף את הסיסמה לפני הרצה !!!

# DNS וקאש בסיסי
nscache 65536
nserver 8.8.8.8
nserver 1.1.1.1

# מצב אימות: משתמש+סיסמה
auth strong

# משתמשים: admin עם סיסמה (CL = cleartext בקובץ)
# החלף "סיסמה_חזקה_כאן" בסיסמה ארוכה ואקראית
users admin:CL:סיסמה_חזקה_כאן

# הרשאות: רק למשתמש admin
allow admin

# פרוקסי HTTP/HTTPS על פורט 3128
proxy -p3128

# לוג לקובץ (אופציונלי - להסיר סולמית כדי להפעיל)
# log C:\3proxy\3proxy.log D
